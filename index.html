    }
    .hero h1 { font-size: 2rem; font-weight: bold; letter-spacing: 0.06em; margin-bottom: 10px; }
    .hero .subtitle { font-size: 0.95rem; opacity: 0.65; margin-bottom: 20px; }
    .hero .stats { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; }
    .hero .stat {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 22px; border-radius: 24px; font-size: 0.82rem;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .section { padding: 52px 0 40px; }
    .section-header {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 32px; padding-bottom: 16px;
      border-bottom: 2px solid #e2e8f0;
    }
    .section-icon { font-size: 1.6rem; }
    .section-title { font-size: 1.3rem; font-weight: bold; color: #1a202c; }
    .section-count { font-size: 0.82rem; color: #718096; margin-top: 3px; }
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 20px;
    }
    .book-card {
      background: white; border-radius: 12px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      text-decoration: none; color: inherit;
      display: flex; flex-direction: column;
    }
    .book-card:hover { transform: translateY(-5px); box-shadow: 0 12px 28px rgba(0,0,0,0.14); }
    .book-cover-wrap {
      width: 100%; aspect-ratio: 2/3; overflow: hidden;
      background: #e2e8f0; flex-shrink: 0;
    }
    .book-cover {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.3s ease;
    }
    .book-card:hover .book-cover { transform: scale(1.04); }
    .book-info { padding: 13px 13px 15px; display: flex; flex-direction: column; flex: 1; }
    .book-title {
      font-size: 0.78rem; line-height: 1.55; font-weight: bold;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden; color: #2d3748; flex: 1; margin-bottom: 10px;
    }
    .book-btn {
      display: block; text-align: center; font-size: 0.72rem;
      font-weight: bold; padding: 6px 0; border-radius: 6px; letter-spacing: 0.03em;
    }
    .kindle-btn { background: #FF9900; color: white; }
    .paperback-btn { background: #232F3E; color: white; }
    .divider { border: none; border-top: 1px solid #e2e8f0; }
    footer {
      background: #1a202c; color: rgba(255,255,255,0.45);
      text-align: center; padding: 28px; font-size: 0.78rem; margin-top: 48px;
    }
    @media (max-width: 600px) {
      .hero h1 { font-size: 1.5rem; }
      .books-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }

// ── 以下は変更不要（自動で画面を生成します）──────────────

function buildCard(book, type) {
  const url = `https://www.amazon.co.jp/dp/${book.asin}`;
  const btnClass = type === 'kindle' ? 'kindle-btn' : 'paperback-btn';
  return `
    <a class="book-card" href="${url}" target="_blank" rel="noopener">
      <div class="book-cover-wrap">
        <img class="book-cover" src="${book.img}" alt="${book.title}" loading="lazy">
      </div>
      <div class="book-info">
        <div class="book-title">${book.title}</div>
        <span class="book-btn ${btnClass}">Amazonで見る</span>
      </div>
    </a>`;
}

  const kn = BOOKS.kindle.length;
  const pb = BOOKS.paperback.length;

  document.getElementById('paperback-count').textContent = `${pb}冊`;

}
